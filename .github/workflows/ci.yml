name: Reproduce zig -l:file.so bug

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  reproduce:
    name: Validate bug is reproducible
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache zig downloads
        uses: actions/cache@v4
        with:
          path: zig/
          key: zig-${{ runner.os }}-${{ runner.arch }}-0.13.0-0.14.0

      - name: Run reproduction script
        run: bash reproduce.sh
